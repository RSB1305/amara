name: Check

# Runs the same gate as the deploy build, but on every push and pull request, so a
# broken commit is visible before it reaches the deployment path.
on:
  push:
    branches: ['**']
  pull_request:

# The job only reads the repository and builds it; it never writes back.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version, shared with local setup.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Block known high and critical dependency vulnerabilities. Lower-severity
      # advisories remain visible without turning CI into a noisy patch gate.
      - run: npm run audit:dependencies

      # Dev-only tools are outside the production Astro typecheck, but they are
      # still maintained code and must not regress unnoticed.
      - run: npm run typecheck:tools

      - run: npm run typecheck:tests

      # Contract tests protect booking, localization, routing and registry
      # semantics before broader shared components are refactored.
      - run: npm run test:contracts

      - run: npx playwright install --with-deps chromium

      # The browser smoke test exercises native dialog behaviour with real
      # keyboard and pointer input, including the backdrop dismissal path.
      - run: npm run test:browser

      # prebuild runs the typecheck and the slug, fallback and image policies;
      # postbuild runs the structured data audit and the SEO title assertions.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://amara-lodging.es
