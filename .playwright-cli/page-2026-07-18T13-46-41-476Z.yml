        - generic [ref=e124]:
          - generic [ref=e125]:
            - img "AMARA Playa als Apartment-Basis in Nerja" [ref=e127]
            - img "Helle Apartment-Atmosphäre in Nerja bei AMARA Playa" [ref=e129]
          - generic [ref=e130]:
            - generic [ref=e131]: Wo in Nerja übernachten
            - heading "Wählen Sie die Lage nach Ihrem Tagesrhythmus" [level=2] [ref=e132]
            - paragraph [ref=e133]: "Die beste Lage in Nerja hängt weniger von einem einzelnen Wahrzeichen ab, sondern davon, wie der Tag laufen soll: zuerst Strand, abends Altstadt, ruhige Nächte oder Natur Richtung Maro."
            - generic [ref=e134]:
              - generic [ref=e135]:
                - generic [ref=e136]: "01"
                - generic [ref=e137]:
                  - heading "Torrecilla & West-Nerja" [level=3] [ref=e138]
                  - paragraph [ref=e139]: Eine praktische Basis für Strandtage, Restaurants, Einkäufe und einfache Alltagswege. Das ist die stärkste Passung für AMARA Playa und für Gäste, die Meer möchten, ohne jeden Tag auf das Auto angewiesen zu sein.
              - generic [ref=e140]:
                - generic [ref=e141]: "02"
                - generic [ref=e142]:
                  - heading "Altstadt & Balcón de Europa" [level=3] [ref=e143]
                  - paragraph [ref=e144]: "Ideal für Gäste, die abends mitten im Zentrum sein möchten: Tapas-Gassen, Aussichtspunkte und klassische Nerja-Atmosphäre. Dafür können Parken und Zufahrt in der Hochsaison enger werden."
              - generic [ref=e145]:
                - generic [ref=e146]: "03"
                - generic [ref=e147]:
                  - heading "Burriana" [level=3] [ref=e148]
                  - paragraph [ref=e149]: Der ausgeprägteste Strandrhythmus mit Restaurants, Strandservices und Wassersport. Sehr gut, wenn der Strand das Hauptprogramm ist, weniger ruhig, wenn Nerja voll ist.
              - generic [ref=e150]:
                - generic [ref=e151]: "04"
                - generic [ref=e152]:
                  - heading "Carabeo, Calahonda & El Salón" [level=3] [ref=e153]
                  - paragraph [ref=e154]: Kleinere Buchten und zentrale Meeresatmosphäre unterhalb der Altstadt. Schön für Paare und kurze Badepausen, aber mit mehr Stufen und weniger Fläche als die größeren Strände.
              - generic [ref=e155]:
                - generic [ref=e156]: "05"
                - generic [ref=e157]:
                  - heading "Maro & geschützte Küste" [level=3] [ref=e158]
                  - paragraph [ref=e159]: Diese Lage passt zu Natur, Kajak, Klippen und ruhigerem Küstengefühl. Saisonale Zufahrtsregeln können sich ändern, daher ist flexible Planung wichtig.
        - generic [ref=e162]:
          - generic [ref=e163]:
            - generic [ref=e164]: Strandrhythmus
            - heading "Welcher Strand in Nerja passt zu Ihrem Aufenthalt?" [level=2] [ref=e165]
            - paragraph [ref=e166]: Nerja ist nicht nur ein Strand. Es ist eine Reihe unterschiedlicher Küstenstimmungen - von praktischen Stadtstränden über kleine Buchten bis zu naturgeprägten Tagen Richtung Maro.
          - generic [ref=e167]:
            - article [ref=e168]:
              - heading "Torrecilla" [level=3] [ref=e169]
              - paragraph [ref=e170]: Praktisch für einen zentralen Strandtag auf der Westseite, mit unkomplizierten Wegen vor und nach dem Baden.
            - article [ref=e171]:
              - heading "Burriana" [level=3] [ref=e172]
              - paragraph [ref=e173]: Der klassische Strand mit viel Infrastruktur, Restaurants, Wassersport und lebendiger Urlaubsatmosphäre.
            - article [ref=e174]:
              - heading "Calahonda, Carabeo & El Salón" [level=3] [ref=e175]
              - paragraph [ref=e176]: Kleinere zentrale Buchten für stimmungsvolle Badepausen unterhalb der Altstadt, oft mit mehr Stufen und weniger Platz.
            - article [ref=e177]:
              - heading "Playazo & Chucho" [level=3] [ref=e178]
              - paragraph [ref=e179]: Längerer, offener Strandrhythmus auf der Westseite, sinnvoll, wenn Platz und einfachere Ankunft wichtig sind.
            - article [ref=e180]:
              - heading "Maro & Cañuelo" [level=3] [ref=e181]
              - paragraph [ref=e182]: Ideal für Naturtage, Klippen, klares Wasser und Kajakpläne. Vorab die saisonale Zufahrt prüfen.
        - generic [ref=e184]:
          - generic [ref=e185]:
            - generic [ref=e186]: Nerja praktisch
            - heading "Was Sie vor der Buchung planen sollten" [level=2] [ref=e187]
            - paragraph [ref=e188]: "Der richtige Nerja-Aufenthalt ist zuerst praktisch und dann romantisch: Klären Sie, wo das Auto bleibt, wohin Sie abends laufen und welchen Strandrhythmus Sie wirklich möchten."
          - generic [ref=e189]:
            - article [ref=e190]:
              - generic [ref=e191]: Parken
              - heading "Im Sommer wird es eng" [level=3] [ref=e192]
              - list [ref=e193]:
                - listitem [ref=e194]: Wählen Sie eine Basis, bei der Alltagswege nicht jedes Mal das Auto brauchen.
                - listitem [ref=e195]: Rechnen Sie im Zentrum abends, am Wochenende und in der Hochsaison mit mehr Parkdruck.
                - listitem [ref=e196]: Für Maro und geschützte Strände die aktuelle saisonale Zufahrt vorab prüfen.
            - article [ref=e197]:
              - generic [ref=e198]: Zu Fuß
              - heading "Strandzugang ist nicht überall gleich" [level=3] [ref=e199]
              - list [ref=e200]:
                - listitem [ref=e201]: Zentrale Buchten sind wunderschön, bedeuten aber oft Stufen.
                - listitem [ref=e202]: Torrecilla und West-Nerja sind meist einfacher für tägliche Strandroutinen.
                - listitem [ref=e203]: Altstadt-Abende sind zu Fuß schön, aber Schuhe und Timing zählen.
            - article [ref=e204]:
              - generic [ref=e205]: Ausflüge
              - heading "Nerja und Frigiliana gehören zusammen" [level=3] [ref=e206]
              - list [ref=e207]:
                - listitem [ref=e208]: In Nerja wohnen für das Meer und Frigiliana wegen der Dorfatmosphäre besuchen.
                - listitem [ref=e209]: In Frigiliana wohnen für Ruhe und für Strände nach Nerja hinunterfahren.
                - listitem [ref=e210]: Beides funktioniert; entscheidend ist die tägliche Basis, nicht die Entfernung.
