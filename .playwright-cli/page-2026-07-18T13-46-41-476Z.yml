                - paragraph [ref=e106]: Nerja hat eine abwechslungsreiche Küste mit Stadtstränden, kleinen Buchten und geschützter Landschaft Richtung Maro. Die Strandwahl ist daher fast so wichtig wie die Apartmentlage.
