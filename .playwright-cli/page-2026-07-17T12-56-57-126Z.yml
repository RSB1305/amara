          - generic [ref=f4e49]: Guía de entorno · Frigiliana
          - heading "Aparcamiento en Frigiliana" [level=1] [ref=f4e50]
          - paragraph [ref=f4e51]: Frigiliana no es un resort costero llano. Es vertical, escalonada e histórica. Aquí la duda del aparcamiento es en el fondo una duda sobre vuestro ritmo diario al movernos.
        - generic [ref=f4e52]:
          - generic [ref=f4e53]:
            - heading "¿Es complicado ir en coche?" [level=2] [ref=f4e54]
            - generic [ref=f4e55]:
              - generic [ref=f4e56]:
                - heading "La respuesta breve" [level=3] [ref=f4e57]
                - paragraph [ref=f4e58]: No es intrínsecamente difícil, pero es distinto. Frigiliana encaja mejor con quienes priorizan la atmósfera frente a un acceso en coche sin fricción puerta a puerta.
              - generic [ref=f4e59]:
                - heading "La variable real" [level=3] [ref=f4e60]
                - paragraph [ref=f4e61]: La experiencia depende por completo de dónde os alojéis. Una casa arriba del todo en el casco se vive de forma muy distinta a un alojamiento en la zona baja.
          - generic [ref=f4e62]:
            - generic [ref=f4e63]:
              - heading "Lo que más importa" [level=2] [ref=f4e64]
              - paragraph [ref=f4e65]: Olvidad el mito del “aparcamiento imposible”. Centraos en estas tres realidades prácticas.
            - generic [ref=f4e66]:
              - article [ref=f4e67]:
                - heading "Posición antes que proximidad" [level=3] [ref=f4e72]
                - paragraph [ref=f4e73]: Importa menos la plaza más cercana que lo empinado del camino. Un paseo llano un poco más largo suele ser mejor que una subida corta y vertical con equipaje.
              - article [ref=f4e74]:
                - heading "El ritmo del día" [level=3] [ref=f4e79]
                - paragraph [ref=f4e80]: A mediodía hay mucho turismo de día. Por la mañana temprano y al atardecer se respira calma. Si vuestra base implica entrar y salir en coche a mediodía sin parar, notaréis más fricción.
              - article [ref=f4e81]:
                - heading "La realidad de caminar" [level=3] [ref=f4e84]
                - paragraph [ref=f4e85]: Caminaréis. Subiréis escalones. Frigiliana está pensada para el peatón. Tomadlo como parte del encanto, no como un fallo logístico.
          - generic [ref=f4e86]:
