          - heading "El tiempo en Frigiliana" [level=1] [ref=f5e50]
          - paragraph [ref=f5e51]: Frigiliana puede sentirse cálida durante el día, pero su ladera suele aportar tardes más respirables. Para estancias con noche, importa menos la predicción y más cómo se sienten la terraza, el descanso y los paseos después del atardecer.
