              - paragraph [ref=f5e56]: Frigiliana está por encima de la costa, y esa altura sutil cambia la sensación del día. En la costa el calor se queda, mientras que el pueblo suele soltarlo antes — sobre todo cuando el sol cae tras la sierra.
