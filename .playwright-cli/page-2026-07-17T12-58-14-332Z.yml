            - heading "Lo que se nota al pasar la noche" [level=2] [ref=f5e175]
            - paragraph [ref=f5e176]: "El pueblo se disfruta por la tarde: la terraza aguanta más, refresca antes tras el atardecer y dormir puede ser más fácil que en la costa. La contrapartida: las capas importan — sobre todo en invierno y en calles con sombra."
          - generic [ref=f5e177]:
            - heading "Interpretación práctica" [level=2] [ref=f5e178]
            - paragraph [ref=f5e179]: Frigiliana encaja con quien prioriza tardes respirables, caminar con comodidad y tiempo de terraza. Si os afectan las noches calurosas, las temporadas intermedias y la ladera suelen sentirse muy equilibradas.
