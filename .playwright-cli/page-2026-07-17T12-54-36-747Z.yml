          - generic [ref=f1e49]: Guía de entorno · Frigiliana
          - heading "Aparcamiento en Frigiliana" [level=1] [ref=f1e50]
          - paragraph [ref=f1e51]: Frigiliana no es un resort costero llano. Es vertical, escalonada e histórica. Aquí la duda del aparcamiento es en el fondo una duda sobre vuestro ritmo diario al movernos.
        - generic [ref=f1e52]:
          - generic [ref=f1e53]:
            - heading "¿Es complicado ir en coche?" [level=2] [ref=f1e54]
            - generic [ref=f1e55]:
              - generic [ref=f1e56]:
                - heading "La respuesta breve" [level=3] [ref=f1e57]
                - paragraph [ref=f1e58]: No es intrínsecamente difícil, pero es distinto. Frigiliana encaja mejor con quienes priorizan la atmósfera frente a un acceso en coche sin fricción puerta a puerta.
              - generic [ref=f1e59]:
                - heading "La variable real" [level=3] [ref=f1e60]
                - paragraph [ref=f1e61]: La experiencia depende por completo de dónde os alojéis. Una casa arriba del todo en el casco se vive de forma muy distinta a un alojamiento en la zona baja.
          - generic [ref=f1e62]:
            - generic [ref=f1e63]:
              - heading "Lo que más importa" [level=2] [ref=f1e64]
              - paragraph [ref=f1e65]: Olvidad el mito del “aparcamiento imposible”. Centraos en estas tres realidades prácticas.
            - generic [ref=f1e66]:
              - article [ref=f1e67]:
                - heading "Posición antes que proximidad" [level=3] [ref=f1e72]
                - paragraph [ref=f1e73]: Importa menos la plaza más cercana que lo empinado del camino. Un paseo llano un poco más largo suele ser mejor que una subida corta y vertical con equipaje.
              - article [ref=f1e74]:
                - heading "El ritmo del día" [level=3] [ref=f1e79]
                - paragraph [ref=f1e80]: A mediodía hay mucho turismo de día. Por la mañana temprano y al atardecer se respira calma. Si vuestra base implica entrar y salir en coche a mediodía sin parar, notaréis más fricción.
              - article [ref=f1e81]:
                - heading "La realidad de caminar" [level=3] [ref=f1e84]
                - paragraph [ref=f1e85]: Caminaréis. Subiréis escalones. Frigiliana está pensada para el peatón. Tomadlo como parte del encanto, no como un fallo logístico.
          - generic [ref=f1e86]:
